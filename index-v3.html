<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Support SaaS</title>

<style>
    body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top, #eef2ff, #f8fafc);
        color: #0f172a;
        transition: 0.3s ease;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 40px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .logo {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    .reviews-btn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 10px 20px rgba(34,197,94,0.25);
        transition: 0.2s ease;
    }

    .reviews-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 26px rgba(34,197,94,0.35);
    }

    /* DARK MODE BUTTON */
    .dark-toggle {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.1);
        background: white;
        cursor: pointer;
        font-weight: 600;
    }

    /* HERO */
    .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 70px 40px;
        gap: 40px;
    }

    .hero-text {
        max-width: 520px;
    }

    .hero-text h1 {
        font-size: 44px;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
    }

    .hero-text p {
        font-size: 16px;
        color: #475569;
        line-height: 1.6;
    }

    /* COFFEE */
    .coffee-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .steam {
        position: absolute;
        top: -28px;
        font-size: 18px;
        opacity: 0.25;
        letter-spacing: 4px;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(-6px); opacity: 0.4; }
    }

    .coffee {
        width: 150px;
        filter: drop-shadow(0 20px 20px rgba(0,0,0,0.15));
    }

    /* SERVICES */
    .services {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 18px;
        padding: 40px;
        max-width: 1100px;
        margin: auto;
    }

    .service-card {
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 16px;
        padding: 22px;
        text-align: center;
        transition: 0.25s ease;
        box-shadow: 0 10px 25px rgba(0,0,0,0.04);
    }

    .service-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 35px rgba(0,0,0,0.08);
        border-color: rgba(34,197,94,0.25);
    }

    .service-card img {
        width: 52px;
        height: 52px;
        margin-bottom: 12px;
        filter: drop-shadow(0 8px 10px rgba(0,0,0,0.08));
    }

    .service-card h3 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        color: #0f172a;
    }

    .divider {
        height: 1px;
        background: rgba(15, 23, 42, 0.06);
        margin: 10px 40px;
    }

    .footer {
        text-align: center;
        padding: 30px;
        font-size: 13px;
        color: #64748b;
    }

    /* DARK MODE FIXED */
    body.dark {
        background: radial-gradient(circle at top, #0b1220, #050814);
        color: #e2e8f0;
    }

    body.dark .header {
        background: rgba(15, 23, 42, 0.7);
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    body.dark .service-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255,255,255,0.08);
    }

    body.dark .service-card h3 {
        color: #e2e8f0;
    }

    body.dark .hero-text p {
        color: #94a3b8;
    }

    body.dark .dark-toggle {
        background: #1e293b;
        color: white;
        border: 1px solid rgba(255,255,255,0.1);
    }
</style>
</head>
