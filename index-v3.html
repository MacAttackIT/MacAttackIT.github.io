<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Support SaaS</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(255,255,255,0.9);
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
}

.logo {
    font-weight: bold;
    font-size: 18px;
}

.header-right {
    display: flex;
    gap: 12px;
    align-items: center;
}

.reviews-btn {
    background: #22c55e;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
}

.dark-toggle {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
}

/* HERO */
.hero {
    display: flex;
    justify-content: space-between;
    padding: 60px 40px;
    gap: 40px;
}

.hero-text h1 {
    font-size: 40px;
}

.hero-text p {
    color: #475569;
}

/* SERVICES */
.services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    padding: 40px;
}

.service-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #eee;
}

.service-card img {
    width: 48px;
    margin-bottom: 10px;
}

.footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

/* DARK MODE */
body.dark {
    background: #0b1220;
    color: #e2e8f0;
}

body.dark .header {
    background: rgba(15,23,42,0.9);
    border-bottom: 1px solid #1f2937;
}

body.dark .service-card {
    background: #111827;
    border: 1px solid #1f2937;
    color: #e2e8f0;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">Tech Support</div>

    <div class="header-right">
        <button class="dark-toggle" onclick="toggleDark()">Dark Mode</button>
        <a class="reviews-btn" href="#">Reviews</a>
    </div>
</div>

<div class="hero">
    <div class="hero-text">
        <h1>Modern IT Support, Simplified</h1>
        <p>Fast, reliable support for Mac, Windows, WiFi, security, backups and more.</p>
    </div>
</div>

<div class="services">
    <div class="service-card">
        <img src="assets/mac.svg">
        <h3>Mac Support</h3>
    </div>

    <div class="service-card">
        <img src="assets/windows.svg">
        <h3>Windows Support</h3>
    </div>

    <div class="service-card">
        <img src="assets/security.svg">
        <h3>Security</h3>
    </div>

    <div class="service-card">
        <img src="assets/wifi.svg">
        <h3>WiFi Setup</h3>
    </div>
</div>

<div class="footer">
    © 2026 Tech Support — Auckland
</div>

<script>
function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
