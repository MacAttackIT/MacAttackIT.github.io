<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacIT Support</title>

<style>

/* =========================
   BASE
========================= */

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #ffffff;
}

/* =========================
   HERO
========================= */

.hero {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 80px 20px 40px;
    text-align: center;
}

.hero-content {
    max-width: 800px;
}

.hero-laptop {
    width: 280px;
    max-width: 100%;
    margin-bottom: 20px;
}

.tagline {
    font-size: 20px;
    line-height: 1.6;
    color: #e6e6e6;
    margin-top: 10px;
}

/* =========================
   SECTIONS
========================= */

section {
    padding: 60px 20px;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
}

/* =========================
   DIVIDER
========================= */

.section-divider {
    width: 80px;
    height: 3px;
    background: #2ecc71;
    margin: 16px auto 30px;
    border-radius: 2px;
}

/* =========================
   SERVICE GRID
========================= */

.service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}

.service-card {
    background: #1a1d24;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    transition: transform 0.2s ease, background 0.2s ease;
}

.service-card:hover {
    transform: translateY(-4px);
    background: #222632;
}

.service-icon {
    width: 48px;
    height: 48px;
    margin-bottom: 12px;
}

.service-card h3 {
    font-size: 16px;
    margin: 0;
    color: #ffffff;
}

</style>
</head>

<body>

<!-- =========================
     HERO
========================= -->
<section class="hero">

    <div class="hero-content">

        <img class="hero-laptop" src="assets/laptop.png" alt="MacIT Support Laptop">

        <div class="tagline">
            Precision in Code<br>
            Passion for People
        </div>

    </div>

</section>

<!-- =========================
     IT SUPPORT SERVICES
========================= -->
<section class="services">

    <h2>IT Support Services</h2>

    <div class="service-grid">

        <div class="service-card">
            <img class="service-icon" src="assets/mac.svg" alt="Mac Support icon">
            <h3>Mac Support</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/windows.svg" alt="Windows Support icon">
            <h3>Windows Support</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/repair.svg" alt="Repair icon">
            <h3>Repairs</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/security.svg" alt="Security icon">
            <h3>Security</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/wifi.svg" alt="Networking icon">
            <h3>Networking</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/office-365.svg" alt="Microsoft 365 icon">
            <h3>Microsoft 365</h3>
        </div>

    </div>

</section>

<!-- =========================
     SOFTWARE SUPPORT
========================= -->
<section class="software-support">

    <h2>Software Support</h2>

    <div class="section-divider"></div>

    <div class="service-grid">

        <div class="service-card">
            <img class="service-icon" src="assets/office-365.svg" alt="Microsoft 365 icon">
            <h3>Microsoft 365</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/email.svg" alt="Email Support icon">
            <h3>Email Support</h3>
        </div>

        <div class="service-card">
            <img class="service-icon" src="assets/cloud.svg" alt="Cloud Services icon">
            <h3>Cloud Services</h3>
        </div>

    </div>

</section>

</body>
</html>
